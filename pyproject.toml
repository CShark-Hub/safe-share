[project]
name = "safe-share"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Krzysiek Kulig" }
]
requires-python = ">=3.12"
dependencies = [
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
